name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The suite has no hard dependencies: the DOM case skips itself when
      # react/react-dom/jsdom are absent, so `node --test` is enough.
      - run: npm test
