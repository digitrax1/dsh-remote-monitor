# dsh-remote-monitor bundle patch: inserts the dual-face plugin row into the
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base; activate with
# `dsh plugin --profile <name> add link:<path-to-this-package>`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs in
# the host process (host discovery, SSH pool, sampler, /api/dsh-remote-monitor
# routes, rmon_* agent tools), and the `dsh.client` declaration in package.json
# makes the browser half (exports "./client", served at /plugins/<id>/client.js)
# load in the web GUI.
- insert:
    - id: remote-monitor
      name: 'dsh-remote-monitor'
